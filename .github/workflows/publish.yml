name: test-and-publish

on:
  pull_request:
  push:
    branches: [main, codex/malt-transport-canary]
    paths:
      - ".github/workflows/publish.yml"
      - "netarena_agent/Dockerfile"
      - "netarena_agent/__init__.py"
      - "netarena_agent/compiler.py"
      - "netarena_agent/requirements.txt"
      - "netarena_agent/server.py"
      - "requirements-dev.txt"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            netarena_agent/requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests/test_netarena_agent.py -q
      - name: Byte-compile
        run: python -m compileall -q netarena_agent
      - name: A2A card smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m netarena_agent.server --host 127.0.0.1 --port 8001 --card-url http://127.0.0.1:8001/ &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import asyncio
          import time
          import urllib.request
          import uuid

          import httpx
          from a2a.client import A2ACardResolver, ClientConfig, ClientFactory
          from a2a.types import Message, Part, Role, TextPart

          url = "http://127.0.0.1:8001/.well-known/agent-card.json"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      card = json.load(response)
                  assert card["name"] == "onejump-netarena-malt-agent"
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("A2A agent card did not become ready")

          async def send_request():
              async with httpx.AsyncClient(timeout=10) as http_client:
                  card = await A2ACardResolver(
                      httpx_client=http_client,
                      base_url="http://127.0.0.1:8001/",
                  ).get_agent_card()
                  client = ClientFactory(
                      ClientConfig(httpx_client=http_client, streaming=True)
                  ).create(card)
                  message = Message(
                      kind="message",
                      role=Role.user,
                      parts=[Part(TextPart(kind="text", text=(
                          "List all the child nodes of ju1.a1.m4. "
                          "Return a list of child node names."
                      )))],
                      message_id=uuid.uuid4().hex,
                  )
                  last_event = None
                  async for event in client.send_message(message):
                      last_event = event
                  rendered = (
                      last_event.model_dump_json()
                      if hasattr(last_event, "model_dump_json")
                      else str(last_event)
                  )
                  assert "def process_graph" in rendered

          asyncio.run(send_request())
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: netarena_agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netarena-malt-agent:latest
            ghcr.io/${{ github.repository_owner }}/netarena-malt-agent:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Deterministic NetArena MALT AgentBeats participant
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Record immutable digest
        run: echo '`${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

  latency-canary:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/codex/malt-transport-canary'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, binary, hints, hints-binary, coalesce, hints-coalesce-binary]
        trial: [1, 2, 3]
    env:
      AMBER_IMAGE: ghcr.io/rdi-foundation/amber-cli:v0.3
      COMPOSE_PROJECT: malt-canary-${{ github.run_id }}-${{ matrix.variant }}-${{ matrix.trial }}
      PROXY_PORT: "18080"
      PURPLE_IMAGE: ghcr.io/${{ github.repository_owner }}/netarena-malt-agent@${{ needs.publish.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Amber CLI
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${AMBER_IMAGE}"
          cid="$(docker create "${AMBER_IMAGE}")"
          trap 'docker rm "${cid}" >/dev/null 2>&1 || true' EXIT
          install -d "${RUNNER_TEMP}/bin"
          docker cp "${cid}:/amber" "${RUNNER_TEMP}/bin/amber"
          chmod +x "${RUNNER_TEMP}/bin/amber"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Build 30-query canary scenario
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p latency-canary
          case "${VARIANT}" in
            baseline)
              content_type=text
              connection_close=always
              stream_mode=off
              early_hints=0
              coalesce_writes=0
              ;;
            binary)
              content_type=binary
              connection_close=always
              stream_mode=off
              early_hints=0
              coalesce_writes=0
              ;;
            hints)
              content_type=text
              connection_close=always
              stream_mode=off
              early_hints=1
              coalesce_writes=0
              ;;
            hints-binary)
              content_type=binary
              connection_close=always
              stream_mode=off
              early_hints=1
              coalesce_writes=0
              ;;
            coalesce)
              content_type=text
              connection_close=always
              stream_mode=off
              early_hints=0
              coalesce_writes=1
              ;;
            hints-coalesce-binary)
              content_type=binary
              connection_close=always
              stream_mode=off
              early_hints=1
              coalesce_writes=1
              ;;
            stream-close)
              content_type=text
              connection_close=never
              stream_mode=close
              ;;
            stream-hold)
              content_type=text
              connection_close=never
              stream_mode=hold
              ;;
            *)
              echo "unknown canary variant: ${VARIANT}" >&2
              exit 1
              ;;
          esac
          jq -n \
            --arg image "${PURPLE_IMAGE}" \
            --arg content_type "${content_type}" \
            --arg connection_close "${connection_close}" \
            --arg stream_mode "${stream_mode}" \
            --arg early_hints "${early_hints}" \
            --arg coalesce_writes "${coalesce_writes}" \
            '{
              manifest_version: "0.1.0",
              config_schema: {
                type: "object",
                properties: {},
                required: [],
                additionalProperties: false
              },
              program: {
                image: $image,
                entrypoint: "python -m netarena_agent.server --host 0.0.0.0 --port 8001",
                env: {
                  PYTHONUNBUFFERED: "1",
                  PUBLIC_URL: "http://127.0.0.1:8001/",
                  MALT_RESPONSE_CONTENT_TYPE: $content_type,
                  MALT_CONNECTION_CLOSE: $connection_close,
                  MALT_STREAM_MODE: $stream_mode,
                  MALT_EARLY_HINTS: $early_hints,
                  MALT_COALESCE_WRITES: $coalesce_writes
                },
                network: {endpoints: [{name: "a2a_endpoint", port: 8001}]}
              },
              slots: {},
              provides: {a2a: {kind: "a2a", endpoint: "a2a_endpoint"}},
              exports: {a2a: "a2a"},
              metadata: {
                name: "One Jump NetArena MALT Agent",
                participant_roles: ["malt_operator"]
              }
            }' > latency-canary/purple.json5

          jq -n '{
            manifest_version: "0.1.0",
            config_schema: {
              type: "object",
              properties: {},
              required: [],
              additionalProperties: false
            },
            components: {
              gateway: {
                manifest: "https://raw.githubusercontent.com/RDI-Foundation/agentbeats-gateway/refs/tags/v0.3/amber-manifest.json5",
                config: {
                  assessment_config: {
                    prompt_type: "zeroshot_base",
                    num_queries: 3,
                    complexity_level: ["level1", "level2", "level3"],
                    output_dir: "dump",
                    output_file: "query_output.jsonl",
                    benchmark_path: "assessment_queries.jsonl",
                    regenerate_benchmark: true
                  },
                  participant_roles: {green: "green", purple1: "malt_operator"},
                  callback_urls: {}
                }
              },
              green: {
                manifest: "https://raw.githubusercontent.com/RDI-Foundation/netarena-agentbeats/5e54ccb1394658818149e510812988175216314a/amber/amber-manifest-green.json5",
                config: {}
              },
              malt_operator: {manifest: "./purple.json5", config: {}}
            },
            bindings: [
              {to: "#gateway.green", from: "#green.a2a"},
              {to: "#gateway.purple1", from: "#malt_operator.a2a"},
              {to: "#green.proxy", from: "#gateway.proxy", weak: true}
            ],
            exports: {results: "#gateway.results"}
          }' > latency-canary/scenario.json5

      - name: Run exact Amber and NetArena canary
        shell: bash
        run: |
          set -euo pipefail
          amber compile latency-canary/scenario.json5 \
            --output latency-canary/scenario-ir.json \
            --docker-compose latency-canary/compose
          compose=(docker compose -f latency-canary/compose/compose.yaml -p "${COMPOSE_PROJECT}")
          proxy_pid=""
          cleanup() {
            exit_code=$?
            if [[ -n "${proxy_pid}" ]]; then
              kill "${proxy_pid}" >/dev/null 2>&1 || true
              wait "${proxy_pid}" >/dev/null 2>&1 || true
            fi
            if [[ ${exit_code} -ne 0 ]]; then
              echo "Amber proxy log:" >&2
              test -f latency-canary/amber-proxy.log && cat latency-canary/amber-proxy.log >&2 || true
              "${compose[@]}" logs --no-color >&2 || true
            fi
            "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
            exit "${exit_code}"
          }
          trap cleanup EXIT

          docker pull "${PURPLE_IMAGE}"
          "${compose[@]}" up -d
          amber proxy latency-canary/compose \
            --project-name "${COMPOSE_PROJECT}" \
            --export "results=127.0.0.1:${PROXY_PORT}" \
            > latency-canary/amber-proxy.log 2>&1 &
          proxy_pid=$!

          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            if ! kill -0 "${proxy_pid}" >/dev/null 2>&1; then
              echo "amber proxy exited unexpectedly" >&2
              exit 1
            fi
            response="$(curl -fsS "http://127.0.0.1:${PROXY_PORT}/" || true)"
            if [[ -z "${response}" ]] || \
              ! status="$(jq -r '.status // empty' <<<"${response}" 2>/dev/null)"; then
              sleep 3
              continue
            fi
            if [[ "${status}" == "completed" ]]; then
              jq . <<<"${response}" > latency-canary/results.json
              break
            fi
            if [[ -n "${status}" && "${status}" != "running" ]]; then
              echo "canary finished with status ${status}" >&2
              jq . <<<"${response}" >&2
              exit 1
            fi
            sleep 3
          done
          test -f latency-canary/results.json || {
            echo "timed out waiting for canary results" >&2
            exit 1
          }

      - name: Verify and summarize canary
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}-${{ matrix.trial }}
        run: |
          set -euo pipefail
          jq -e '
            .status == "completed" and
            (.results | length) == 31 and
            .results[-1].avg_correctness == 1 and
            .results[-1].avg_safety == 1
          ' latency-canary/results.json >/dev/null
          summary="$(jq --arg variant "${VARIANT}" '{
            variant: $variant,
            queries: (.results | length - 1),
            avg_correctness: .results[-1].avg_correctness,
            avg_safety: .results[-1].avg_safety,
            avg_latency_s: .results[-1].avg_latency_s,
            labels: ([.results[:-1][]] | group_by(.Label) | map({
              label: .[0].Label,
              n: length,
              avg_latency_s: (map(."Result-Latency") | add / length)
            }))
          }' latency-canary/results.json)"
          jq . <<<"${summary}"
          {
            echo "### ${VARIANT}"
            echo '```json'
            jq . <<<"${summary}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v4
        with:
          name: latency-${{ matrix.variant }}-${{ matrix.trial }}
          path: latency-canary/results.json
