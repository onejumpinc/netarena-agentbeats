name: test-and-publish

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "netarena_agent/Dockerfile"
      - "netarena_agent/__init__.py"
      - "netarena_agent/compiler.py"
      - "netarena_agent/requirements.txt"
      - "netarena_agent/server.py"
      - "tests/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: netarena_agent/requirements.txt
      - name: Install
        run: python -m pip install -r netarena_agent/requirements.txt pytest networkx
      - name: Unit tests
        run: python -m pytest tests/test_netarena_agent.py -q
      - name: Byte-compile
        run: python -m compileall -q netarena_agent
      - name: A2A card smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m netarena_agent.server --host 127.0.0.1 --port 8001 --card-url http://127.0.0.1:8001/ &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import asyncio
          import time
          import urllib.request
          import uuid

          import httpx
          from a2a.client import A2ACardResolver, ClientConfig, ClientFactory
          from a2a.types import Message, Part, Role, TextPart

          url = "http://127.0.0.1:8001/.well-known/agent-card.json"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      card = json.load(response)
                  assert card["name"] == "onejump-netarena-malt-agent"
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("A2A agent card did not become ready")

          async def send_request():
              async with httpx.AsyncClient(timeout=10) as http_client:
                  card = await A2ACardResolver(
                      httpx_client=http_client,
                      base_url="http://127.0.0.1:8001/",
                  ).get_agent_card()
                  client = ClientFactory(
                      ClientConfig(httpx_client=http_client, streaming=True)
                  ).create(card)
                  message = Message(
                      kind="message",
                      role=Role.user,
                      parts=[Part(TextPart(kind="text", text=(
                          "List all the child nodes of ju1.a1.m4. "
                          "Return a list of child node names."
                      )))],
                      message_id=uuid.uuid4().hex,
                  )
                  last_event = None
                  async for event in client.send_message(message):
                      last_event = event
                  rendered = (
                      last_event.model_dump_json()
                      if hasattr(last_event, "model_dump_json")
                      else str(last_event)
                  )
                  assert "def process_graph" in rendered

          asyncio.run(send_request())
          PY

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: netarena_agent/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/netarena-malt-agent:latest
            ghcr.io/${{ github.repository_owner }}/netarena-malt-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Record immutable digest
        run: echo '`${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
